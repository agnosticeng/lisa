[workspace]
members = [
    "crates/lisa-backend",
    "crates/lisa-cpu",
    "crates/lisa-models",
    "crates/lisa-gguf",
    "crates/lisa-engine",
    "crates/lisa-serve",
    "crates/lisa-cli",
    "crates/lisa-bench",
    "crates/lisa-metal",
    "crates/lisa-mlx",
    "crates/lisa-ui",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
lisa-backend = { path = "crates/lisa-backend" }
lisa-cpu = { path = "crates/lisa-cpu" }
lisa-models = { path = "crates/lisa-models" }
anyhow = "1.0.104"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
block2 = "0.6"
clap = { version = "4.6.6", features = ["derive"] }
half = "2.7.1"
hf-chat-template = "1"
hf-hub = { version = "0.4.3", default-features = false, features = ["ureq"] }
libm = "0.2.15"
libc = "0.2"
memmap2 = "0.9.11"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
objc2-metal = "0.3"
objc2-web-kit = "0.3.2"
rayon = "1.11.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
tokenizers = "0.23.2"
lisa-gguf = { path = "crates/lisa-gguf" }
lisa-engine = { path = "crates/lisa-engine" }
lisa-metal = { path = "crates/lisa-metal" }
lisa-mlx = { path = "crates/lisa-mlx" }
lisa-serve = { path = "crates/lisa-serve" }

[profile.release]
opt-level = 3
lto = "thin"

# Shipping builds keep source-level symbols outside the signed app bundle.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
debug = 2
split-debuginfo = "packed"

# Presentation and template rendering favor compact code. Inference, sampling,
# tokenization and the tensor runtime retain release optimization level 3.
[profile.dist.package.lisa-ui]
opt-level = "z"

[profile.dist.package.minijinja]
opt-level = "z"

# Network transfer code favors app size; inference profiles are unchanged.
[profile.dist.package.hf-hub]
opt-level = "z"

[profile.dist.package.ureq]
opt-level = "z"

# TLS transfer code shares the networking size policy used by the desktop bundle.
[profile.dist.package.rustls]
opt-level = "z"

# URL/IDNA processing is used only by Hub downloads, not model tokenization.
[profile.dist.package.url]
opt-level = "z"

[profile.dist.package.idna]
opt-level = "z"

[profile.dist.package.idna_adapter]
opt-level = "z"

[profile.dist.package.icu_normalizer]
opt-level = "z"

[profile.dist.package.icu_properties]
opt-level = "z"

[profile.dist.package.rustls-webpki]
opt-level = "z"

# Model schemas and symbolic plan construction contain no device execution.
[profile.dist.package.lisa-models]
opt-level = "s"

# Checkpoint parsing and chat-template rendering contain no device execution.
[profile.dist.package.lisa-mlx]
opt-level = "z"

[profile.dist.package.hf-chat-template]
opt-level = "z"
