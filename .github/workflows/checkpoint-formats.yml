name: Portable formats and model plans
on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup update stable && rustup default stable
      - name: Check the portable dependency boundary
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          assert not Path("crates/lisa-metal/src/models").exists()
          assert not Path("crates/lisa-engine/src/models").exists()
          assert "pub mod models;" not in Path("crates/lisa-engine/src/lib.rs").read_text()
          assert not Path("crates/lisa-runtime").exists()
          for source in Path('crates/lisa-engine/src').rglob('*.rs'):
              text = source.read_text()
              assert not any(api in text for api in ['lisa_metal', 'MetalDevice', 'lisa_runtime']), source
          execution = Path('crates/lisa-engine/src/execution.rs').read_text()
          assert 'thread_local!' not in execution
          attention = Path('crates/lisa-metal/src/kernels/sparse/attention.rs').read_text()
          assert not any(policy in attention for policy in ['dsa_absorbed_attention', 'dsa_prefill_value_slices', 'GLM53_DSA_NATIVE_OVERRIDE', 'GLM53_DSA_VALUE_DENSE_PREFIX'])
          assert 'pub fn wide_decode(' not in Path('crates/lisa-metal/src/kernels/sparse/gguf.rs').read_text()
          assert "pub mod models;" not in Path("crates/lisa-metal/src/lib.rs").read_text()
          tree = subprocess.check_output([
              'cargo', 'tree', '-p', 'lisa-mlx', '-p', 'lisa-gguf', '-p', 'lisa-models', '-p', 'lisa-backend', '-p', 'lisa-cpu', '--edges', 'normal'
          ], text=True)
          print(tree)
          assert not any(name in tree for name in ['lisa-metal', 'lisa-engine', 'objc2'])
          engine_tree = subprocess.check_output(['cargo', 'tree', '-p', 'lisa-engine', '--all-features', '--edges', 'normal'], text=True)
          assert not any(name in engine_tree for name in ['lisa-metal', 'lisa-cpu', 'lisa-runtime', 'objc2', 'metal-rs'])
          app_tree = subprocess.check_output(['cargo', 'tree', '-p', 'lisa-serve', '--no-default-features', '--edges', 'normal'], text=True)
          assert not any(name in app_tree for name in ['lisa-metal', 'objc2', 'metal-rs'])
          model_tree = subprocess.check_output(['cargo', 'tree', '-p', 'lisa-models', '--edges', 'normal'], text=True)
          assert not any(name in model_tree for name in ['lisa-metal', 'lisa-engine', 'lisa-mlx', 'lisa-gguf', 'objc2'])
          for source in Path('crates/lisa-models/src').rglob('*.rs'):
              text = source.read_text()
              assert not any(api in text for api in ['std::fs', 'std::env', 'std::process', 'std::net', 'std::thread']), source
          device_tree = subprocess.check_output(['cargo', 'tree', '-p', 'lisa-metal', '-p', 'lisa-cpu', '--edges', 'normal'], text=True)
          assert not any(name in device_tree for name in ['lisa-models', 'lisa-engine', 'lisa-mlx', 'lisa-gguf'])
          PY
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint portable crates
        run: cargo clippy --release -p lisa-mlx -p lisa-gguf -p lisa-models -p lisa-backend -p lisa-cpu --all-targets -- -D warnings
      - name: Check portable crate docs
        run: cargo doc --no-deps --document-private-items -p lisa-mlx -p lisa-gguf -p lisa-models -p lisa-backend -p lisa-cpu
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Test format readers without Apple frameworks or a GPU
        run: cargo test --release -p lisa-mlx -p lisa-gguf -p lisa-models -p lisa-backend -p lisa-cpu --lib -- --test-threads=1
      - name: Test the portable engine and CPU inference without Metal
        run: cargo test --release -p lisa-engine --all-features --lib -- --test-threads=1
      - name: Test CPU application composition without Metal
        run: cargo test --release -p lisa-serve --no-default-features --lib -- --test-threads=1
