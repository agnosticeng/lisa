[package]
name = "lisa-metal"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native tensor runtime and Metal kernels for LISA"

[lib]
name = "lisa_metal"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
lisa-backend.workspace = true
# Native Metal runtime; checkpoint formats are owned by separate crates.
objc2.workspace = true
objc2-metal = { workspace = true, features = [
    "MTLFunctionConstantValues",
    "MTLLibrary",
    "MTLDevice",
    "MTLBuffer",
    "MTLResource",
    "MTLCommandQueue",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLComputeCommandEncoder",
    "MTLComputePipeline",
    "MTLAllocation",
    "MTLResidencySet",
    "MTLFence",
    "MTLTypes",
    "MTLGPUAddress",
    "block2",
] }
block2.workspace = true
objc2-foundation.workspace = true
half.workspace = true
miniz_oxide = "0.9"
sha2.workspace = true

[dev-dependencies]
serde_json.workspace = true

[build-dependencies]
miniz_oxide = "0.9"
sha2.workspace = true

[lints]
workspace = true
