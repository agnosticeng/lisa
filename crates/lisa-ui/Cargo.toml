[package]
name = "lisa-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
lisa-models.workspace = true
lisa-mlx.workspace = true
lisa-engine.workspace = true
lisa-gguf.workspace = true
lisa-metal.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
lisa-serve.workspace = true
objc2.workspace = true
objc2-avf-audio = { version = "0.3", default-features = false, features = [
    "AVAudioApplication",
    "AVAudioBuffer",
    "AVAudioEngine",
    "AVAudioFormat",
    "AVAudioIONode",
    "AVAudioNode",
    "AVAudioTime",
    "AVAudioTypes",
    "AVSpeechSynthesis",
    "block2",
] }
objc2-speech = { version = "0.3", default-features = false, features = [
    "std",
    "SFSpeechRecognitionRequest",
    "SFSpeechRecognitionResult",
    "SFSpeechRecognitionTask",
    "SFSpeechRecognizer",
    "SFTranscription",
    "block2",
    "objc2-avf-audio",
] }
objc2-foundation = { workspace = true, features = [
    "NSObject",
    "NSData",
    "NSString",
    "NSArray",
    "NSDictionary",
    "NSSet",
    "NSGeometry",
    "NSValue",
    "NSNotification",
    "NSURL",
    "NSURLRequest",
    "NSFileManager",
    "NSBundle",
    "NSEnumerator",
    "NSIndexSet",
    "NSRange",
    "NSError",
    "NSIndexPath",
    "NSPathUtilities",
    "NSProcessInfo",
    "NSRunLoop",
    "NSTimer",
    "NSUserDefaults",
] }
objc2-web-kit = { workspace = true, features = [
    "WKWebView",
    "WKWebViewConfiguration",
    "WKNavigation",
    "WKNavigationDelegate",
    "block2",
] }
block2.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { workspace = true, features = [
    "NSApplication",
    "NSWindow",
    "NSWindowController",
    "NSPanel",
    "NSEvent",
    "NSTrackingArea",
    "NSView",
    "NSGraphics",
    "NSGraphicsContext",
    "NSBezierPath",
    "NSCursor",
    "NSGlassEffectView",
    "NSViewController",
    "NSSplitViewController",
    "NSSplitViewItem",
    "NSSplitView",
    "NSResponder",
    "NSControl",
    "NSCell",
    "NSProgressIndicator",
    "NSButton",
    "NSText",
    "NSTextField",
    "NSTextView",
    "NSTableView",
    "NSTableColumn",
    "NSTableCellView",
    "NSTableHeaderView",
    "NSTableRowView",
    "NSUserInterfaceItemIdentification",
    "NSScrollView",
    "NSClipView",
    "NSStackView",
    "NSGridView",
    "NSSwitch",
    "NSAlert",
    "NSBox",
    "NSColor",
    "NSFont",
    "NSFontDescriptor",
    "NSImage",
    "NSImageView",
    "NSWorkspace",
    "NSLayoutConstraint",
    "NSLayoutAnchor",
    "NSMenu",
    "NSMenuItem",
    "NSOpenPanel",
    "NSSavePanel",
    "NSPasteboard",
    "NSVisualEffectView",
    "NSParagraphStyle",
    "objc2-core-foundation",
] }

[[bin]]
name = "lisa-ui"
path = "src/main.rs"

[lib]
name = "lisa_app"
crate-type = ["rlib", "staticlib"]
path = "src/lib.rs"
