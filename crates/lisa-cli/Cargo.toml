[package]
name = "lisa-cli"
version = "0.1.0"
edition = "2024"
description = "lisa CLI"

[[bin]]
name = "lisa"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
lisa-mlx = { path = "../lisa-mlx" }
serde_json = "1.0.151"
lisa-engine = { path = "../lisa-engine" }
lisa-serve = { path = "../lisa-serve" }
