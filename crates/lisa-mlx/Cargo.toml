[package]
name = "lisa-mlx"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native tensor runtime and Metal kernels for LISA"

[lib]
name = "lisa_mlx"
path = "src/lib.rs"

[features]
# Enable only when the local GLM-5.3 DS4 capture archive is available.
glm53-fixtures = []

[dependencies]
# No MLX dependency: the library name is `lisa_mlx` so call sites resolve here.
objc2.workspace = true
objc2-metal = { workspace = true, features = [
    "MTLFunctionConstantValues",
    "MTLLibrary",
    "MTLDevice",
    "MTLBuffer",
    "MTLResource",
    "MTLCommandQueue",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLComputeCommandEncoder",
    "MTLComputePipeline",
    "MTLAllocation",
    "MTLResidencySet",
    "MTLFence",
    "MTLTypes",
    "MTLGPUAddress",
    "block2",
] }
block2.workspace = true
objc2-foundation.workspace = true
half.workspace = true
