[package]
name = "lisa-bench"
version = "0.1.0"
edition = "2024"
description = "lisa test / parity / benchmark CLI"
default-run = "lisa-bench"

[[bin]]
name = "lisa-bench"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
lisa-mlx = { path = "../lisa-mlx" }
serde_json = "1.0.151"
lisa-engine = { path = "../lisa-engine" }
